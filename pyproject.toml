[project]
name = "mortgage-assistant"
version = "0.1.0"
description = "Mortgage advisor assistant on the Rabobank policy: RAG baseline first, GraphRAG later"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.26",
    "sentence-transformers>=5.0",
    "neo4j>=5.28",
    "groq>=0.30",
    "gradio>=6.3.0",
    "python-dotenv>=1.2.1",
    "openai>=1.100",
    "rdflib>=7.1",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mortgage_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
